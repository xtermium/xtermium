# cargo-about, for scripts/notices.mjs: the licences xtermium may ship, preferred first (a crate
# offering a choice is listed under the first one here), and the platforms whose crates count.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "BSL-1.0",
    "MIT-0",
    "0BSD",
    "Unlicense",
    "CC0-1.0",
    "MPL-2.0",
    "WTFPL",
]
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
