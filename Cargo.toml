[package]
name = "xtermium"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
authors = ["Sotirios Roussis"]
license = "Apache-2.0"
homepage = "https://xtermium.com"
repository = "https://github.com/xtermium/xtermium"
description = "Terminal with a session manager: SSH, SFTP, RDP and tunnels"

[dependencies]
anyhow = "1"
argon2 = "0.6"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
chacha20poly1305 = "0.11"
directories = "6"
# Paths without the \\?\ prefix that canonicalizing adds on Windows (Tauri's resource folder).
dunce = "1"
arboard = "3"
fontdb = "0.24"
image = { version = "0.25", default-features = false, features = ["png"] }
getrandom = "0.3"
keyring = "4"
portable-pty = "0.9"
# Randomness for new SSH keys (sshkeys.rs): the RNG russh's ssh-key takes.
rand = { version = "0.10", features = ["thread_rng"] }
rcgen = { version = "0.14", default-features = false, features = ["ring"] } # the self-signed certificate of automation over the network
regex = "1"
# Checks a passkey's signature (lock.rs); already in the build through rustls and russh.
ring = "0.17"
# HTTPS for icons fetched by URL (and, later, sync). Rustls with ring, which russh already uses.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
russh = { version = "0.64", default-features = false, features = ["flate2", "ring", "rsa"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4"
vnc-rs = "0.6"
tokio-rustls = { version = "0.26", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "macros", "fs"] }
tauri = { version = "2.12", features = ["macos-private-api", "unstable", "tray-icon"] }
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
# Desktop notifications (new versions, dropped connections) and
# "start at login" (support.rs).
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
toml = "1"
wezterm-term = { git = "https://github.com/wezterm/wezterm", rev = "e2a98e1b8af156988ad0ac778658ac27b60a55fb" }
wezterm-surface = { git = "https://github.com/wezterm/wezterm", rev = "e2a98e1b8af156988ad0ac778658ac27b60a55fb" }
wezterm-blob-leases = { git = "https://github.com/wezterm/wezterm", rev = "e2a98e1b8af156988ad0ac778658ac27b60a55fb", features = ["simple_tempdir"] }
russh-sftp = "3"
window-vibrancy = "0.8.1"
smb2 = "0.28"

# A website tab's WebView2 says when it gets the keyboard and which keys it got (web.rs), both
# already in the build via wry; the lock asks Windows Hello and the time since the last input.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_WinRT", "Security_Credentials_UI"] }
# Waits on Windows Hello's answer (lock.rs); the `windows` crate's own async types.
windows-future = "0.3"

# The process priority (support.rs `priority`).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Website views on Linux: Tauri packs a child webview under the main one in the window's GtkBox;
# web.rs moves it into a GtkFixed over the page so it follows its tab (the versions wry builds on).
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[profile.release]
lto = "thin"
# No symbol tables in what ships: a third smaller, and it starts sooner.
strip = true

# Line numbers for panics, not full debug info: with it the exe was 750 MB and took 2 s to load.
[profile.dev]
debug = "line-tables-only"

# Dependencies do the heavy lifting (zlib, base64, image and RDP decoding, the VT parser,
# crypto): keep them optimized in dev builds too, or graphics-heavy sessions crawl.
[profile.dev.package."*"]
opt-level = 3
debug = false

# GTK 3's bindings (Linux: tauri, wry, webkit2gtk) stop at glib 0.18, whose last release has an
# unsound string iterator (GHSA-wrw7-89jp-8q8g, fixed only from 0.20). patches/glib is glib
# 0.18.5 with gtk-rs's one-line fix. ponytail: drop it once Tauri moves to glib 0.20 or later.
[patch.crates-io]
glib = { path = "patches/glib" }
